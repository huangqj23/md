# 画面风格预设：分镜里只写内容，画风由这里统一追加，保证整条片子风格一致。
# - image_suffix：追加到每个关键帧提示词后面
# - video_suffix：追加到每个视频提示词后面
# - font：字幕字体（OFL 开源字体，可商用）；speed：配音语速（MiniMax 用）
# - tts_style：配音的语气和节奏，用文字描述（Gemini 配音用，相当于给配音员的导演说明）
# - character_suffix：只描述画风的后缀，用于角色参考图（不能带云海、山水这类场景词，否则会混进参考图）

guofeng-ink:
  label: 国风水墨
  hint: 水墨淡彩、留白、宣纸质感，意境优先
  image_suffix: 国风水墨淡彩，宣纸肌理，留白构图，青灰与淡金色调，柔和自然光，东方意境，电影级构图，画面中没有任何文字、印章和水印
  video_suffix: 保持水墨画风和色调，动作舒缓，画面中不要出现任何文字、字幕和水印
  font: LXGW WenKai
  speed: 0.95
  tts_style: 沉稳温润的男声，像在月下讲一个古老的故事；语速偏慢，句与句之间留一点空白，引用诗句时放慢、略带吟诵感
  character_suffix: 国风水墨淡彩人物画，宣纸肌理，画面中没有任何文字、印章和水印

cinematic-guofeng:
  label: 电影感国风写实
  hint: 写实电影剧照质感，东方美学，体积光，胶片颗粒
  image_suffix: 电影剧照质感，东方美学，写实，体积光，浅景深，胶片颗粒，色调统一，画面中没有任何文字和水印
  video_suffix: 保持电影感和色调，运镜平稳，画面中不要出现任何文字、字幕和水印
  font: LXGW WenKai
  speed: 0.95
  tts_style: 低沉有质感的电影旁白，克制而有画面感，语速适中，情绪藏在语气里，不夸张
  character_suffix: 电影剧照质感，东方美学，写实，画面中没有任何文字和水印

epic-myth:
  label: 东方神话史诗
  hint: 宏大奇观，金光云海，神兽宫殿
  image_suffix: 东方神话史诗，宏大奇观，云海与金色天光，体积光，暖金与青蓝对比，电影级写实，细节丰富，画面中没有任何文字和水印
  video_suffix: 运镜宏大流畅，光影变化有层次，画面中不要出现任何文字、字幕和水印
  font: LXGW WenKai
  speed: 1.0
  tts_style: 大气磅礴的史诗旁白，声音饱满有力量，节奏有起伏，重音落在意象词上
  character_suffix: 东方神话史诗人物设定，电影级写实，细节丰富，画面中没有任何文字和水印

red-epic:
  label: 红色史诗
  hint: 历史纪实质感，群像远景，金色阳光，庄严坚韧；不出现领袖和英烈的写实正脸
  image_suffix: 历史史诗电影质感，写实，群像远景，人物多为背影和侧影，金色阳光，庄严坚韧，画面中没有任何文字和水印
  video_suffix: 运镜庄重平稳，画面中不要出现任何文字、字幕和水印
  font: Source Han Serif SC
  speed: 0.95
  tts_style: 庄重深情的纪录片旁白，坚定有力，不夸张、不煽情，语速稍慢
  character_suffix: 历史电影质感，写实，画面中没有任何文字和水印

physics-clean:
  label: 科普纪录片
  hint: 写实纪录片画面，清晰明亮，现象本身是主角
  image_suffix: 科普纪录片画面，写实摄影，清晰明亮，主体突出，画面中没有任何文字、公式和水印
  video_suffix: 运镜平稳，现象清晰可见，画面中不要出现任何文字、字幕和水印
  font: Noto Sans SC
  speed: 1.05
  tts_style: 清晰亲切的科普讲解，像一位耐心的老师，节奏明快，关键概念稍作强调
  character_suffix: 写实摄影，清晰明亮，画面中没有任何文字和水印
