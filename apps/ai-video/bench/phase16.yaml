# Phase 1.6 冒烟实测（v3 计划 8.1 节 Step 1），方舟到位前只用 H3、gpt-image-2.5 和 MiniMax TTS。
# 题材：759 年杜甫弃官，携家西行入秦州。台词都是自拟的，诗句出自杜甫《月夜忆舍弟》（公版）。
#
# 运行：ai-video bench run --file bench/phase16.yaml --run phase16 --providers h3,gpt_image,minimax_tts
#   只跑一部分时加 --cases，例如先出图：--cases p16_look；先跑 1 段视频：--cases p16_say_quote
#
# - modes: [] 的用例只出图（场景、角色参考图），给别的用例引用
# - 「用例/关键帧」引用别的用例的图；ref_audio 引用 speech 里写了 provider 的声音样本
# - 提示词照着流水线的拼法写：前置要求 + 动作 + 台词 + 反向约束（bench 不追加风格预设）

cases:
  # 第 1 项：gpt-image-2.5 的历史电影感关键帧（同时是后面的首帧和场景参考图）
  - id: p16_look
    title: 历史电影感关键帧 ×3
    direction: 剧情片 · 群像
    route: 关键帧画质
    aspect: '16:9'
    modes: []
    check: 有没有真实历史电影的实拍质感；唐代服饰和建筑是否可信；画面里有没有乱码文字
    keyframes:
      - id: a
        prompt: >
          真实历史电影剧照，唐代，黄昏。华州官署的大门口，青灰瓦檐，朱漆斑驳的木门半掩，门前三级石阶。
          一位四十七八岁、清瘦、灰白短须的男子侧身站在石阶前，头戴黑色幞头，身穿洗旧的青灰色圆领长袍，
          双手捧着一件叠好的深绿色官服，正弯腰要把它放在石阶上。侧面中远景，人物在画面左侧三分之一处，
          夕阳从画面右侧斜照，体积光，浅景深，胶片颗粒，色调低饱和偏暖。画面中没有任何文字和水印。
      - id: b
        prompt: >
          真实历史电影剧照，唐代，深秋傍晚。陇山之间一条黄土山道沿着山坡蜿蜒，路边枯草和几棵落光叶子的树，
          远处山口隐约有一座土筑关隘，天空是灰蓝色，云层低垂。固定侧面远景，画面开阔，没有人物。
          胶片颗粒，色调冷灰偏青。画面中没有任何文字和水印。
      - id: c
        prompt: >
          真实历史电影剧照，唐代，秋夜。秦州城里一处简陋的土墙小院，院中一棵老槐树，树下一张旧木桌，
          低矮的茅草屋檐下透出一点油灯的暖光，天上一轮明亮的满月，月光把院子照成冷白色。固定侧面中远景，没有人物。
          胶片颗粒，冷暖对比。画面中没有任何文字和水印。

  # 第 2 项：角色一致性：全身图 → 大头照（以全身图为参考）→ 两张带角色参考的关键帧
  - id: p16_dufu
    title: 角色参考图：杜甫
    direction: 剧情片 · 群像
    route: 角色一致性
    aspect: '3:4'
    modes: []
    check: 大头照和全身图是不是同一个人；服饰颜色款式是否一致
    keyframes:
      - id: body
        prompt: >
          角色参考图：单人全身正面站姿，双臂自然下垂，纯浅灰色背景，柔和均匀的光线，画面里没有其他人物、道具和文字。
          人物：四十七八岁的唐代男子，清瘦，面容疲惫，灰白短须，头戴黑色幞头，身穿洗旧的青灰色圆领长袍，腰系黑色布带，
          脚穿黑色布靴。真实历史电影定妆照质感，写实。
      - id: face
        refs: [body]
        prompt: >
          角色参考图：参考图中同一人物的头部特写，正面，表情平静，纯浅灰色背景，柔和均匀的光线，画面里没有其他人物和文字。
          保持参考图中的五官、胡须、幞头和衣领完全一致。真实历史电影定妆照质感，写实。

  - id: p16_keys
    title: 带角色参考的关键帧
    direction: 剧情片 · 群像
    route: 角色一致性
    aspect: '16:9'
    modes: []
    check: 和角色参考图像不像；场景是否沿用了场景参考图
    keyframes:
      - id: k1
        refs: [p16_dufu/body, p16_dufu/face, p16_look/b]
        prompt: >
          真实历史电影剧照。参考图 1、2 是人物杜甫的全身和头部，参考图 3 是场景。深秋傍晚的陇山黄土山道上，
          杜甫牵着一匹瘦弱的棕色老马，从画面左侧缓步走来，风吹起他的衣袍下摆。固定侧面远景，人物在画面中偏小。
          保持人物外貌和服饰与参考图一致。胶片颗粒，色调冷灰偏青。画面中没有任何文字和水印。
      - id: k2
        refs: [p16_dufu/body, p16_dufu/face, p16_look/c]
        prompt: >
          真实历史电影剧照。参考图 1、2 是人物杜甫的全身和头部，参考图 3 是场景。秋夜秦州的土墙小院里，
          杜甫独自坐在老槐树下的旧木桌旁，抬头望着天上的满月，桌上一盏油灯。侧面中景。
          保持人物外貌和服饰与参考图一致。胶片颗粒，冷暖对比。画面中没有任何文字和水印。
      - id: k3
        refs: [p16_dufu/body, p16_dufu/face, p16_look/c]
        prompt: >
          真实历史电影剧照。参考图 1、2 是人物杜甫的全身和头部，参考图 3 是场景。秋夜秦州的土墙小院里，
          杜甫坐在木桌旁，一个七八岁、穿粗布短衣的小男孩站在他身边，仰头看着他，两人都在月光下。侧面中景。
          保持杜甫的外貌和服饰与参考图一致。胶片颗粒，冷暖对比。画面中没有任何文字和水印。

  # 第 3 项：H3 原生中文台词，两种写法 × 两个镜头
  - id: p16_say_quote
    title: 原生台词 · 引号写法 · 弃官
    direction: 剧情片 · 群像
    route: 原生台词
    aspect: '16:9'
    duration: 6
    first: p16_look/a
    check: 台词「这官，不做了」念得对不对、口型是否对上、声音是否像四十多岁的男子；有没有自己切镜头
    video_prompt: >
      真实历史电影实拍质感，固定侧面中远景。男子把叠好的官服轻轻放在石阶上，慢慢直起身，
      平静地说：「这官，不做了。」说完转身朝画面右侧走去。人物情绪克制，不抬头哭喊。
      全程一个连续镜头，不切换镜头、不插入特写，不新增首帧里没有的人物；画面中不要出现任何文字、字幕和水印。

  - id: p16_say_plain
    title: 原生台词 · 直写写法 · 弃官
    direction: 剧情片 · 群像
    route: 原生台词
    aspect: '16:9'
    duration: 6
    first: p16_look/a
    check: 和引号写法比：哪种念得更准、更自然
    video_prompt: >
      真实历史电影实拍质感，固定侧面中远景。男子把叠好的官服轻轻放在石阶上，慢慢直起身，转身朝画面右侧走去。
      台词（男子，平静，低声）：这官，不做了。
      人物情绪克制，不抬头哭喊。全程一个连续镜头，不切换镜头、不插入特写，不新增首帧里没有的人物；
      画面中不要出现任何文字、字幕和水印。

  - id: p16_poem_quote
    title: 原生台词 · 引号写法 · 吟诗
    direction: 剧情片 · 群像
    route: 原生台词
    aspect: '16:9'
    duration: 6
    first: p16_keys/k2
    check: 诗句「露从今夜白，月是故乡明」一字不差吗；吟诵感、停顿
    video_prompt: >
      真实历史电影实拍质感，侧面中景，镜头缓慢推近。杜甫望着天上的满月，嘴唇微动，
      低声吟道：「露从今夜白，月是故乡明。」油灯的火苗轻轻晃动。人物情绪克制。
      全程一个连续镜头，不切换镜头、不插入特写，不新增首帧里没有的人物；画面中不要出现任何文字、字幕和水印。

  - id: p16_poem_plain
    title: 原生台词 · 直写写法 · 吟诗
    direction: 剧情片 · 群像
    route: 原生台词
    aspect: '16:9'
    duration: 6
    first: p16_keys/k2
    check: 和引号写法比：诗句是否更准
    video_prompt: >
      真实历史电影实拍质感，侧面中景，镜头缓慢推近。杜甫望着天上的满月，油灯的火苗轻轻晃动。
      台词（杜甫，低声吟诵，语速慢）：露从今夜白，月是故乡明。
      人物情绪克制。全程一个连续镜头，不切换镜头、不插入特写，不新增首帧里没有的人物；画面中不要出现任何文字、字幕和水印。

  # 第 4 项：参考模式 + 声音样本，同一角色连续 3 个台词镜头（对照组是第 3 项的首帧版）
  - id: p16_ref_road
    title: 参考模式 · 台词 1 · 山道
    direction: 剧情片 · 群像
    route: 声音一致性
    aspect: '16:9'
    duration: 6
    modes: [r2v]
    refs: [p16_dufu/body, p16_dufu/face, p16_look/b]
    ref_audio: [dufu_voice]
    check: 三段的声音是不是同一个人、像不像声音样本；人物像不像参考图
    r2v_prompt: >
      真实历史电影实拍质感，固定侧面远景。深秋傍晚的陇山黄土山道上，参考图里的男子牵着一匹瘦弱的老马缓步前行，
      他回头望了一眼来路，说：「天快黑了，前面找户人家歇脚。」声音和参考音频一致。人物情绪克制。
      全程一个连续镜头，不切换镜头，不出现其他人物；画面中不要出现任何文字、字幕和水印。

  - id: p16_ref_yard
    title: 参考模式 · 台词 2 · 小院
    direction: 剧情片 · 群像
    route: 声音一致性
    aspect: '16:9'
    duration: 6
    modes: [r2v]
    refs: [p16_dufu/body, p16_dufu/face, p16_look/c]
    ref_audio: [dufu_voice]
    check: 同上
    r2v_prompt: >
      真实历史电影实拍质感，侧面中景。秋夜土墙小院，参考图里的男子坐在老槐树下的木桌旁，抬头看月亮，
      轻声说：「这里的月亮，和家里的一样亮。」声音和参考音频一致。人物情绪克制。
      全程一个连续镜头，不切换镜头，不出现其他人物；画面中不要出现任何文字、字幕和水印。

  - id: p16_ref_gate
    title: 参考模式 · 台词 3 · 官署
    direction: 剧情片 · 群像
    route: 声音一致性
    aspect: '16:9'
    duration: 6
    modes: [r2v]
    refs: [p16_dufu/body, p16_dufu/face, p16_look/a]
    ref_audio: [dufu_voice]
    check: 同上；也可以和第 3 项 p16_say_quote 比构图
    r2v_prompt: >
      真实历史电影实拍质感，固定侧面中远景。黄昏的唐代官署门口，参考图里的男子把叠好的深绿色官服放在石阶上，
      慢慢直起身，平静地说：「这官，不做了。」声音和参考音频一致。人物情绪克制，不抬头哭喊。
      全程一个连续镜头，不切换镜头，不出现其他人物；画面中不要出现任何文字、字幕和水印。

  # 第 5 项 + 第 8 项：只要环境声（台词另用 TTS 配）；同一个走动镜头两种模式对比
  - id: p16_walk
    title: 环境声 · 人物大幅走动（首帧 vs 参考）
    direction: 剧情片 · 群像
    route: 首帧与参考对比
    aspect: '16:9'
    duration: 6
    modes: [i2v, r2v]
    first: p16_keys/k1
    refs: [p16_dufu/body, p16_dufu/face, p16_look/b]
    check: 走动和运镜稳不稳；两种模式里人物像不像参考图；有没有人说话（应当只有风声和马蹄声）
    video_prompt: >
      真实历史电影实拍质感，镜头缓慢横移跟拍。杜甫牵着老马沿山道从画面左侧走到右侧，走过山道转弯处，
      远处的关隘渐渐露出来，风吹起衣袍下摆。无人说话，只有风声和马蹄声。
      全程一个连续镜头，不切换镜头、不插入特写，不新增首帧里没有的人物；画面中不要出现任何文字、字幕和水印。
    r2v_prompt: >
      真实历史电影实拍质感，镜头缓慢横移跟拍。深秋傍晚的陇山黄土山道，参考图里的男子牵着一匹瘦弱的老马，
      沿山道从画面左侧走到右侧，走过山道转弯处，远处的关隘渐渐露出来，风吹起衣袍下摆。无人说话，只有风声和马蹄声。
      全程一个连续镜头，不切换镜头，不出现其他人物；画面中不要出现任何文字、字幕和水印。

  - id: p16_night
    title: 环境声 · 月夜小院
    direction: 剧情片 · 群像
    route: 环境声
    aspect: '16:9'
    duration: 6
    first: p16_keys/k2
    check: 有没有人说话（应当只有虫鸣和风声）；配上 TTS 台词后是否违和
    video_prompt: >
      真实历史电影实拍质感，侧面中景，镜头固定。杜甫坐在木桌旁望着月亮，慢慢低下头，
      伸手拨了拨油灯的灯芯。无人说话，只有虫鸣和风吹树叶的声音。人物情绪克制。
      全程一个连续镜头，不切换镜头、不插入特写，不新增首帧里没有的人物；画面中不要出现任何文字、字幕和水印。

  # 第 8 项：两人同框，首帧 vs 参考
  - id: p16_two
    title: 两人同框（首帧 vs 参考）
    direction: 剧情片 · 群像
    route: 首帧与参考对比
    aspect: '16:9'
    duration: 6
    modes: [i2v, r2v]
    first: p16_keys/k3
    refs: [p16_dufu/body, p16_dufu/face, p16_look/c]
    check: 两个人物会不会融合或变形；杜甫像不像参考图；孩子的台词是不是孩子的声音
    video_prompt: >
      真实历史电影实拍质感，侧面中景，镜头固定。小男孩拉了拉杜甫的衣袖，仰头问：「爹，我们还要走多远？」
      杜甫低头看着他，伸手摸了摸他的头，没有说话。人物情绪克制。
      全程一个连续镜头，不切换镜头、不插入特写，不新增首帧里没有的人物；画面中不要出现任何文字、字幕和水印。
    r2v_prompt: >
      真实历史电影实拍质感，侧面中景，镜头固定。秋夜土墙小院，月光下，参考图里的男子坐在木桌旁，
      身边站着一个七八岁、穿粗布短衣的小男孩。小男孩拉了拉他的衣袖，仰头问：「爹，我们还要走多远？」
      男子低头看着他，伸手摸了摸他的头，没有说话。人物情绪克制。
      全程一个连续镜头，不切换镜头，不出现第三个人物；画面中不要出现任何文字、字幕和水印。

  # 第 6 项：写实人脸近景（虚构形象，不用真人照片）
  - id: p16_tears
    title: 写实人脸近景 · 含泪
    direction: 剧情片 · 第一人称
    route: 写实人脸
    aspect: '16:9'
    duration: 6
    check: H3 收不收；眼泪和表情是否自然；脸会不会在视频后段走样
    keyframes:
      - id: a
        refs: [p16_dufu/face]
        prompt: >
          真实历史电影剧照，参考图是人物的头部。秋夜油灯下，这位唐代男子的面部近景，侧脸四分之三角度，
          眼眶泛红，含着泪光，神情克制。浅景深，暖色油灯光从侧面照亮半张脸，胶片颗粒。画面中没有任何文字和水印。
    video_prompt: >
      真实历史电影实拍质感，面部近景，镜头固定。男子望着前方，一滴眼泪缓缓从眼角流下，他微微抿紧嘴唇，没有出声。
      只有油灯燃烧的细微声音。全程一个连续镜头，不切换镜头；画面中不要出现任何文字、字幕和水印。

  # 第 7 项：单次生成多镜头（这一条故意不写反向约束）
  - id: p16_multishot
    title: 单次生成多镜头 · 10 秒切 3 个镜头
    direction: 剧情片 · 第一人称
    route: 快剪
    aspect: '16:9'
    duration: 10
    first: p16_look/b
    check: 是否真的切了 3 个镜头；切点是否干净；三个镜头里场景和人物是否连贯
    video_prompt: >
      真实历史电影实拍质感，一段 10 秒、包含三个镜头的短片段。镜头一（约 3 秒）：深秋傍晚的陇山黄土山道远景，
      一个牵着瘦马的唐代男子从画面左侧走入。镜头二（约 3 秒）：切到中景，男子停下脚步，回头望向来路。
      镜头三（约 4 秒）：切到马蹄踩在黄土上的特写，尘土扬起。无人说话，只有风声和马蹄声。
      画面中不要出现任何文字、字幕和水印。

speech:
  # 声音样本：参考模式的参考音频（约 8 秒），音色就是这个角色的固定音色
  - id: dufu_voice
    title: 杜甫的声音样本
    provider: minimax_tts
    voice: audiobook_male_1
    speed: 0.95
    text: 秋风起了，家里的孩子该添衣裳了。等到了秦州，先找一处能遮雨的屋子，再想往后的日子。

  # 第 5 项：台词改用 TTS 配，音色和声音样本相同
  - id: dufu_line_road
