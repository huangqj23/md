# Phase 0 测试用例，大多对标收藏里的爆款样片。
# - route：内容类型，汇总时按它生成"内容类型 → 模型"的路由表
# - modes：i2v 首帧图生视频；t2v 文生视频；chain 首尾帧串成的长镜头
# - check：打分时重点看什么
# - speech 的 style：配音的语气和节奏，用文字描述（Gemini 配音按它演绎）

cases:
  - id: taigong_mist
    title: 远景神话人物 + 神兽（对标《太公在此》）
    direction: 民俗神话
    route: 远景神话
    aspect: '16:9'
    duration: 5
    modes: [i2v]
    check: 雾和雪的流动是否自然；神兽结构有没有崩；冷调电影感能不能保持
    keyframes:
      - id: a
        prompt: >
          电影剧照，超宽画幅构图。冬日清晨，雾气弥漫的深山峡谷，一条覆着薄雪的小路蜿蜒向远方，两侧是黑色岩壁和枯树。
          远景中，一位白发长须、身穿素白长袍的老者与一名白衣少年并肩而行，身旁跟着一头体型巨大的白色神兽
          （鹿角、马脸、牛蹄、驴身的"四不像"）和一只白鹤。人物在画面中很小，冷青灰色调，体积雾，柔和散射光，
          胶片颗粒，东方奇幻史诗氛围。画面中没有任何文字。
    video_prompt: >
      镜头缓慢向前推进，山谷里的雾气缓缓流动，细雪飘落。老者、少年与神兽沿着小路缓步向镜头走来，白鹤轻轻展翅。
      保持电影感和冷色调，画面中不要出现任何文字、字幕和水印。

  - id: tang_longtake
    title: 盛唐上元夜一镜到底（对标《梦回盛唐上元夜》）
    direction: 国风群像
    route: 一镜到底
    aspect: '16:9'
    duration: 5
    modes: [chain]
    audio: false
    check: 两段之间有没有接缝；人群是否拖影；酒楼牌匾"醉仙楼"三个字有没有变成乱码
    keyframes:
      - id: a
        prompt: >
          高空航拍视角，唐代长安城上元夜，一条宽阔的主街贯穿画面，两侧是层层叠叠的唐风楼阁，屋檐挂满红色灯笼，
          街上人流如织、车马往来，灯火通明，暖橙色灯光与深蓝夜空形成对比，电影级写实，细节丰富。画面中没有文字。
      # b、c 以上一张关键帧为参考图（ref_prev），保证同一条街、同样的建筑和灯光。
      - id: b
        ref_prev: true
        prompt: >
          唐代长安城上元夜的同一条宽阔主街，镜头降到二层楼高度，俯视熙攘的人群和小吃摊。两侧是层层叠叠的唐风楼阁，
          朱红立柱、青灰瓦檐，屋檐挂满红色灯笼，灯笼近在眼前，暖橙色灯光与深蓝夜空形成对比，电影级写实，细节丰富。画面中没有文字。
      - id: c
        ref_prev: true
        prompt: >
          唐代长安城上元夜的同一条主街，镜头降到行人视线高度，正对街边一座三层唐风酒楼的正门。酒楼朱红立柱、青灰瓦檐，
          屋檐挂满红色灯笼，门楣上挂着一块黑底金字的牌匾，牌匾上写着"醉仙楼"三个楷书大字，门前有身穿唐装的行人驻足交谈，
          暖橙色灯光与深蓝夜空形成对比，电影级写实，细节丰富。
    segments:
      - from: a
        to: b
        prompt: 一镜到底，镜头从高空平稳下降并缓慢前移，掠过灯笼和屋檐，街上的人群和车马持续流动。画面中不要出现字幕和水印。
      - from: b
        to: c
        prompt: 一镜到底，镜头继续平稳下降并向前推进，穿过人群推向酒楼正门，行人自然走动，灯笼轻轻摇晃。画面中不要出现字幕和水印。

