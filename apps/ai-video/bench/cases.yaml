speech:
  - id: poem
    title: 古诗朗诵：《天净沙·秋思》
    speed: 0.9
    style: 沉稳温润，像在吟诵一首古诗，语速偏慢，每句之间留出停顿，最后一句放慢、带一点苍凉
    text: 天净沙·秋思。马致远。枯藤老树昏鸦，小桥流水人家，古道西风瘦马。夕阳西下，断肠人在天涯。
  - id: jieqi
    title: 节气旁白：霜降
    style: 沉稳温润的纪录片旁白，像在讲一个古老的故事，语速偏慢，引用诗句时略带吟诵感
    text: >
      霜降，是秋天的最后一个节气。古人说，气肃而凝，露结为霜。这时候，豺狼开始捕兽囤粮，草木渐渐枯黄，
      蛰虫也都躲进洞里不再出来。"霜叶红于二月花"，杜牧笔下的枫林，正是这个季节最美的风景。天气转凉，早晚记得添衣。
  - id: physics
    title: 物理讲解：彩虹为什么外红内紫
    speed: 1.05
    style: 清晰亲切的科普讲解，像一位耐心的老师，节奏明快，关键数字稍作强调
    text: >
      为什么彩虹外圈是红色，内圈是紫色？阳光其实是由不同颜色的光混合而成的。它射进圆圆的小水滴，先折射，
      再在水滴内部反射一次，最后折射出来。不同颜色的光偏折的角度不一样：红光大约偏转四十二度，紫光大约四十度。
      所以从我们的位置看过去，红色总在最外面。
