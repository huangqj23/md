    route: 风格化人物
    aspect: '9:16'
    duration: 5
    modes: [i2v]
    check: 衣袂和画卷流动的质感；人物比例；整体意境是否保持
    keyframes:
      - id: a
        prompt: >
          竖构图，国风意境。一位身穿青绿色汉服的女子背对镜头，站在悬于云海之上的古老木质楼台尽头，面前是一幅从天垂落的
          巨大青绿山水画卷，画卷上的山水仿佛正在流动，金色的龙形云纹盘旋其间。远处云雾翻涌，暖金色的光从画卷后透出。
          人物位于画面下方三分之一处，写意与写实结合，电影级光影。画面中没有文字。
    video_prompt: >
      女子缓缓抬手，衣袂和发带被风吹起，画卷中的山水与云纹缓慢流动，云海翻涌，镜头缓慢向上升起。
      画面中不要出现任何文字、字幕和水印。

