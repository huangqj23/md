# 模型配置（2026-10）。图像、视频、配音走自己开通的订阅；文案由 Claude 在对话里写（short-video 技能），这里不配置任何文本模型。
#
# - 方舟 Agent Plan（Large）：Seedance 视频、Seedream 图片。专属地址 /api/plan/v3 加专属 key（ARK_PLAN_API_KEY），
#   按 AFP 抵扣。这个 key 只用于图片和视频模型：套餐条款不允许用 API 调用文本和向量模型。控制台请保持「超额后付费」关闭。
# - MiniMax M Plan（Build）：H3 视频、speech-2.8 配音。订阅 key（sk-cp- 开头）直接调原接口，按目录价扣套餐额度，
#   视频只受周额度限制；这里的 price_* 只是折算成人民币的估算值。
# - Gemini API：默认配音 gemini-3.8-flash-tts（有免费层），可选图片 Nano Banana 2.1（没有免费层，要开通 Google Cloud 结算）。
#   国内要走代理，地址写在 .env 的 GEMINI_PROXY。
#
# 字段：
# - plan：按哪个套餐计费（见 plans）；afp_coef / afp_per_image：套餐抵扣系数，换分辨率时同步改 afp_coef
# - price_*：不按套餐 AFP 计的模型的参考单价（元），只用来估算预算
# - key_prefix：套餐 key 的开头，填错成按量 key 时 `ai-video check` 会提醒
# - max_concurrency：同一家同时在跑的任务数
# - enabled: false：保留配置但不启用

plans:
  ark:
    label: 火山方舟 Agent Plan（Large）
    cny_per_afp: 0.002 # ¥500 / 250,000 AFP
    daily_afp: 125000 # 日额度是月额度的一半；图片、视频模型没有 5 小时和周限额
    monthly_afp: 250000
    cycle_day: 9 # 计费月从每月几号开始：按 2026-10-09 购买填的，不对就改成你的购买日
  minimax:
    label: MiniMax M Plan（Build）
    key_env: MINIMAX_API_KEY
    remains_url: https://www.minimax.cn/v1/token_plan/remains

video:
  # Seedance 的 AFP = (24 × 秒数 + 1) × 宽 × 高 / 1024 / 10000 × 抵扣系数。抵扣系数（输入不含视频）：
  # 2.0：480p / 720p 230，1080p 255；2.0 fast：185；2.0 mini：115；2.5：480p / 720p 350，1080p 385。
  # 时长是 4–15 秒的整数（2.5 可到 30 秒）；fast 和 mini 只有 480p、720p。
  seedance:
    adapter: ark_video
    label: Seedance 2.0
    plan: ark
    key_env: ARK_PLAN_API_KEY
    base_url: https://ark.cn-beijing.volces.com/api/plan/v3
    model: doubao-seedance-2.0
    resolution: 720p
    afp_coef: {480p: 230, 720p: 230, 1080p: 255} # 720p 每秒约 500 AFP（约 ¥1）
    max_concurrency: 2
  seedance_fast:
    adapter: ark_video
    label: Seedance 2.0 Fast
    plan: ark
    key_env: ARK_PLAN_API_KEY
    base_url: https://ark.cn-beijing.volces.com/api/plan/v3
    model: doubao-seedance-2.0-fast
    resolution: 720p
    afp_coef: 185
    max_concurrency: 2
  seedance_mini:
    adapter: ark_video
    label: Seedance 2.0 Mini
    plan: ark
    key_env: ARK_PLAN_API_KEY
    base_url: https://ark.cn-beijing.volces.com/api/plan/v3
    model: doubao-seedance-2.0-mini
    resolution: 480p
    afp_coef: 115 # 480p 每秒约 115 AFP（约 ¥0.23），--draft 草稿用
    max_concurrency: 4 # 草稿便宜，多开几路缩短等待
  seedance_25:
    adapter: ark_video
    label: Seedance 2.5
    plan: ark
    key_env: ARK_PLAN_API_KEY
    base_url: https://ark.cn-beijing.volces.com/api/plan/v3
    model: doubao-seedance-2.5
    resolution: 720p
    afp_coef: {480p: 350, 720p: 350, 1080p: 385} # 720p 每秒约 756 AFP（约 ¥1.5）
    max_seconds: 30
    max_concurrency: 2
  h3:
    adapter: minimax_video
    label: MiniMax H3
    key_env: MINIMAX_API_KEY
    key_prefix: sk-cp-
    ping_url: https://www.minimax.cn/v1/token_plan/remains # check --ping 用 M Plan 额度接口验证 Key（免费）
    base_url: https://api.minimax.cn
    model: MiniMax-H3
    resolution: 768P # 2K 更贵
    price_cny_per_second: 0.6 # 按目录价折算的 M Plan 额度消耗（约 $0.08/秒）
    max_concurrency: 2
  kling:
    adapter: kling_video
    label: 可灵 3.0（按量，未开通）
    enabled: false
    key_env: KLING_ACCESS_KEY
    secret_env: KLING_SECRET_KEY
    base_url: https://api-beijing.klingai.com # 海外账号用 https://api-singapore.klingai.com
    model: kling-v3
    mode: pro # pro = 1080p，std = 720p
    durations: [3, 15]
    price_cny_per_second: 1.0
    max_concurrency: 2

image:
  seedream:
    adapter: ark_image
    label: Seedream 5.0 Pro
    plan: ark
    key_env: ARK_PLAN_API_KEY
    base_url: https://ark.cn-beijing.volces.com/api/plan/v3
    model: doubao-seedream-5-0-pro # 套餐文档的写法；如果报模型不存在，改成 doubao-seedream-5.0-pro
    afp_per_image: 150 # 1.5K 及以下每张 150，更大 300；代码里的尺寸都在 1.5K 内
    afp_per_extra_ref: 10 # 参考图第一张免费，第二张起每张 10
    timeout_seconds: 600 # 实测文生图约 45 秒、带参考图约 80 秒，偶尔会卡几分钟；提前断开不会让服务端停止计费
    max_concurrency: 2
  nano_banana:
    adapter: gemini_image
    label: Nano Banana 2.1
    key_env: GEMINI_API_KEY
    proxy_env: GEMINI_PROXY
    base_url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-nano-banana-2.1
    image_size: 2K
    thinking_level: medium
    timeout_seconds: 300
    price_cny_per_image: 0.36 # 2K 约 $0.05；没有免费层，要开通 Google Cloud 结算
    max_concurrency: 2
  gpt_image:
    adapter: openai_image
    label: GPT Image 2（按量，未开通）
    enabled: false
    key_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL
    base_url: https://api.openai.com/v1
    model: gpt-image-2
    quality: medium
    price_cny_per_image: 0.6
    max_concurrency: 2

tts:
  gemini_tts:
    adapter: gemini_tts
    label: Gemini 3.8 Flash TTS
    key_env: GEMINI_API_KEY
    proxy_env: GEMINI_PROXY
    base_url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-3.8-flash-tts
    voices: [Charon, Gacrux, Sadaltager, Algenib] # 预置音色共 30 个；语气由 presets/styles.yaml 的 tts_style 控制
    price_cny_per_10k_chars: 4 # 按付费价估（免费层内为 0）：和 Nano Banana 共用一个 Key 时，项目一开通结算，配音也开始计费
    max_concurrency: 2
  minimax_tts:
    adapter: minimax_tts
    label: MiniMax Speech 2.8
    key_env: MINIMAX_API_KEY
    key_prefix: sk-cp-
    ping_url: https://www.minimax.cn/v1/token_plan/remains
    base_url: https://api.minimax.cn
    model: speech-2.8-hd
    voices: [presenter_male, audiobook_male_1, female-chengshu] # 男性主持人（Phase 0 满分）、男性有声书、成熟女性
    price_cny_per_10k_chars: 3.5 # 按目录价折算的 M Plan 额度消耗
    max_concurrency: 2
  doubao_tts:
    adapter: doubao_tts
    label: 豆包语音 2.0（按量，未开通）
    enabled: false # 豆包语音控制台的按量接口；Agent Plan 里的 doubao-seed-tts-2.0 官方还没公开调用方式
    key_env: DOUBAO_TTS_ACCESS_KEY
    app_id_env: DOUBAO_TTS_APP_ID
    base_url: https://openspeech.bytedance.com/api/v3/tts/unidirectional
    model: seed-tts-2.0 # 作为 X-Api-Resource-Id 发送；以控制台显示的资源 ID 为准
    voices: [zh_male_yuanboxiaoshu_moon_bigtts] # 渊博小叔
    price_cny_per_10k_chars: 3.0
    max_concurrency: 2

# 成片流水线（ai-video new / make）用哪些模型。依据 Phase 0 实测（reports/AI短视频全流程生成开发计划.md 6.1 节）和 v2 方案。
routing:
  image: seedream # 关键帧和角色参考图；封面或画面里要写字时可以临时换成 nano_banana
  video:
    default: seedance_25 # 默认 Seedance 2.5（2026-10-09 指定）；改回 2.0 就写 seedance（每秒约 500 AFP）
    photoreal: h3 # 写实人脸镜头（Seedance 拒收真人脸），也是 Seedance 拒绝时的自动兜底
    draft: seedance_mini # --draft 草稿模式：480p 先出一版看节奏
  tts:
    provider: minimax_tts # 先用 MiniMax；Gemini Key 修好后可改回 gemini_tts（voice 改成 Charon 等，先试听：
    voice: presenter_male # ai-video bench tts --run voices --providers gemini_tts,minimax_tts）

bench:
  keyframe_provider: [seedream] # 视频统一用这里第一个有图的关键帧，保证各家起点一致
  poll_seconds: 10
  timeout_minutes: 30
