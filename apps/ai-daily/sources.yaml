# 信源配置。kind 决定默认可信度标签：
#   official→官方  paper→论文  model/release/repo→代码  price→数据
#   media/newsletter→媒体  community/social/inbox→社区
# 可以用 label 覆盖；track 是主线提示（llm / agent / vision），不写就按关键词判断。
# 2026-09-30 已实测本机可访问的才放进来。

# 时间窗口：收“上一期之后”的动态：从前一期最后一次生成的时间算起（多留 2 小时），同一天重新生成起点不变；
# 最少 12 小时、最多 72 小时（周末停一天也不会漏）；第一次运行按 26 小时
window: {default_hours: 26, min_hours: 12, max_hours: 72}

# 版面：头条 1 条 + 要闻 main 条（平铺，不分栏）+ 快讯 briefs 条；备选进审稿清单；配图最多 max_images 张
layout: {main: 15, briefs: 10, backup: 20, max_images: 16}

