# 国内大模型公司自己的发布渠道（ai_daily/collect/labs.py）：
# - github_orgs：组织新建的公开仓库（开源发布多半从新仓库开始），每个组织查一次 GitHub API；
# - deepseek_news：DeepSeek API 文档的新闻页（模型发布、API 和价格变动）；
# - zai_releases：Z.ai（智谱）的新模型发布页。
# Qwen 官网、StepFun、MiniMax、Kimi 的新闻页是前端渲染或者没有日期，抓不到；它们的发布靠 HF org、GitHub 组织、
# X 线索（AINews）和国外媒体覆盖。
labs:
  github_orgs: [deepseek-ai, QwenLM, zai-org, stepfun-ai, MoonshotAI, MiniMax-AI, ByteDance-Seed, Tencent-Hunyuan,
                XiaomiMiMo, inclusionAI, meituan-longcat, OpenBMB, InternLM, OpenGVLab]
  deepseek_news: true
  zai_releases: true

# 关键仓库的 releases.atom：每个仓库每天只取最新一版，值不值得写交给选题判断
github_releases:
  llm: [vllm-project/vllm, sgl-project/sglang, ggml-org/llama.cpp, huggingface/transformers, huggingface/trl, verl-project/verl, ollama/ollama, NVIDIA/TensorRT-LLM]
  agent: [openai/codex, anthropics/claude-code, google-gemini/gemini-cli, anthropics/claude-agent-sdk-python, openai/openai-agents-python, langchain-ai/langgraph, modelcontextprotocol/modelcontextprotocol, huggingface/smolagents, OpenHands/OpenHands, crewAIInc/crewAI]
  vision: [ultralytics/ultralytics, roboflow/supervision, huggingface/lerobot]

hf:
  daily_papers_limit: 25
  trending_limit: 40
  trending_max_age_hours: 72   # 热门榜上只收 3 天内上传的模型：老模型上榜不算新闻
  per_org: 5
  # 按 org 拉新上传的模型（国内大厂的发布基本都会同步到 HF）
  orgs: [deepseek-ai, Qwen, moonshotai, zai-org, MiniMaxAI, ByteDance-Seed, tencent, baidu, stepfun-ai, internlm,
         openbmb, OpenGVLab, XiaomiMiMo, inclusionAI, meituan-longcat, meta-llama, google, microsoft, nvidia,
         mistralai, openai, ibm-granite, allenai, HuggingFaceTB, apple, black-forest-labs, facebook]

# GitHub Trending：综合榜 + Python 榜。上榜本身就是“今天”的信号（常常是因为当天有发布），
# 但建了一年以上、常年挂榜的老项目不收；创建时间用 GitHub API 查，查过的存进数据库（设了 GITHUB_TOKEN 会带上；
# 未认证每小时 60 次，被限流时剩下的项目不查、条目保留），摘要里写明“创建于 N 天前”，老项目值不值得写交给选题判断。
# 2026-09-30 实测当天上榜的 AI 项目最新的也建于 83 天前，所以门槛是一年而不是一个月。
github_trending: {pages: ["", "python"], max_items: 15, max_repo_age_days: 365}
hn: {min_points: 80, max_items: 15}
openrouter: {enabled: true}

# X 上这些账号算“官方”（AINews 回顾里链接到它们的推文，可信度标“官方”）
official_x_handles: [OpenAI, OpenAIDevs, AnthropicAI, claudeai, GoogleDeepMind, GoogleAI, googleaidevs, xai, deepseek_ai,
                     Alibaba_Qwen, Kimi_Moonshot, Zai_org, MiniMax__AI, huggingface, MistralAI, AIatMeta, nvidia,
                     NVIDIAAIDev, cursor_ai, OpenRouterAI, ollama, vllm_project, lmsysorg, StepFun_ai, XiaomiMiMo]

# 判断“是不是 AI 相关”（HN、GitHub trending、带 filter_keywords 的信源）
# 纯 ASCII 的词：3 个字符以内按整词匹配，更长的按词首匹配（agent 能匹配 agents）
ai_keywords: [ai, llm, llms, gpt, claude, gemini, grok, llama, qwen, deepseek, mistral, kimi, glm, minimax, model, models,
              agent, agentic, mcp, rag, transformer, diffusion, neural, inference, vllm, sglang, gguf, fine-tun, finetun,
              lora, rlhf, reinforcement, embedding, multimodal, vision, vlm, ocr, yolo, segment, detection, robot,
              embodied, copilot, codex, cursor, openai, anthropic, hugging, nvidia, gpu, cuda, tpu, speech, tts, whisper,
              prompt, token, benchmark, machine learning, deep learning, chatbot, reasoning,
              人工智能, 大模型, 智能体, 多模态, 机器学习, 深度学习, 具身, 机器人, 视觉, 推理, 算力, 模型]
